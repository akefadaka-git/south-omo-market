name: A3 backend lint autofix

on:
  push:
    branches: [feat/customer-platform-foundation]
    paths:
      - .github/workflows/a3-lint-fix.yml

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.9"
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Apply safe Ruff fixes
        working-directory: backend
        run: uv run --locked ruff check --fix app tests || true
      - name: Record remaining lint diagnostics
        working-directory: backend
        run: uv run --locked ruff check app tests --output-format=concise || true
      - name: Commit safe lint fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/tests
          if git diff --cached --quiet; then
            echo "No safe Ruff fixes were applicable."
            exit 0
          fi
          git commit -m "style(a3.4): apply safe backend lint fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
