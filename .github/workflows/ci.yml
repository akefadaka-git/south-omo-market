name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: south_omo
          POSTGRES_PASSWORD: local_only_password
          POSTGRES_DB: south_omo_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U south_omo -d south_omo_market"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://south_omo:local_only_password@localhost:5432/south_omo_market
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests --select E9,F63,F7,F82
      - name: Validate backup and restore script syntax
        run: bash -n scripts/backup_restore.sh
      - run: pytest
      - name: Run PostgreSQL migration and audit-trigger integration tests
        run: pytest -q tests/test_postgres_integration.py
      - name: Run S3-compatible object-storage integration tests
        run: pytest -q tests/test_s3_storage.py

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - run: npm install
      - run: npm run build
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter test

  android-build:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
      - name: Generate Android platform scaffold
        working-directory: mobile
        run: flutter create --platforms=android --org=et.southomomarket .
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: south-omo-market-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
