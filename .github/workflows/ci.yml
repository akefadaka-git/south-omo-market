name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: south_omo
          POSTGRES_PASSWORD: local_only_password
          POSTGRES_DB: south_omo_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U south_omo -d south_omo_market"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://south_omo:local_only_password@localhost:5432/south_omo_market
      TEST_S3_ENDPOINT_URL: http://127.0.0.1:5000
      TEST_S3_BUCKET: south-omo-market-ci
      TEST_S3_ACCESS_KEY_ID: test-access-key
      TEST_S3_SECRET_ACCESS_KEY: test-secret-key
      TEST_S3_REGION: us-east-1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Start local S3-compatible test server
        run: |
          nohup moto_server -H 127.0.0.1 -p 5000 >/tmp/moto-server.log 2>&1 </dev/null &
          python - <<'PY'
          import time
          import boto3
          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:5000",
              region_name="us-east-1",
              aws_access_key_id="test-access-key",
              aws_secret_access_key="test-secret-key",
          )
          for attempt in range(30):
              try:
                  client.list_buckets()
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: pytest
      - name: Run PostgreSQL migration and audit-trigger integration tests
        run: pytest -q tests/test_postgres_integration.py
      - name: Run S3-compatible object-storage integration tests
        run: pytest -q tests/test_s3_storage.py

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter test
