[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "south-omo-market-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.9,<3", "Pillow>=10,<13", "python-multipart>=0.0.9,<1", "boto3>=1.35,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "moto[s3]>=5,<6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
